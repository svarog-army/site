services:
  db:
    image: postgres:14
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-passwd}
      POSTGRES_DB: db
      PGDATABASE: db
      PGPASSWORD: ${POSTGRES_PASSWORD:-passwd}
      PGUSER: ${POSTGRES_USER:-postgres}
      PARKING: True

  app:
    image: simple2b/svarog-app:latest
    restart: always
    command: sh ./start_web.sh
    environment:
      APP_ENV: production
      ALCHEMICAL_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-passwd}@db:5432/db
    depends_on:
      - db
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.svarog_prod.rule=Host(`424bat.army`)'
      - 'traefik.http.routers.svarog_prod.tls=true'
      - 'traefik.http.routers.svarog_prod.tls.certresolver=myresolver'
volumes:
  db_data:
