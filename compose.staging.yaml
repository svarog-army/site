services:
  db:
    image: postgres:14
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-passwd}
      POSTGRES_DB: db
      PGDATABASE: db
      PGPASSWORD: ${POSTGRES_PASSWORD:-passwd}
      PGUSER: ${POSTGRES_USER:-postgres}
      PARKING: False

  app:
    image: simple2b/svarog-app:0
    restart: always
    command: sh ./start_web.sh
    environment:
      APP_ENV: production
      ALCHEMICAL_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-passwd}@db:5432/db
    depends_on:
      - db
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.svarog_py.rule=Host(`stage.svarog.424bat.army`)'
      - 'traefik.http.routers.svarog_py.tls=true'
      - 'traefik.http.routers.svarog_py.tls.certresolver=myresolver'

  signal:
    image: bbernhard/signal-cli-rest-api:latest
    restart: always
    environment:
      - MODE=json-rpc
    volumes:
      - "./signal-cli-config:/home/.local/share/signal-cli"

  # api:
  #   image: simple2b/flask-app:0.1
  #   restart: always
  #   command: sh ./start_api.sh
  #   environment:
  #     APP_ENV: production
  #     IS_API: "true"
  #     ALCHEMICAL_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-passwd}@db:5432/db
  #   depends_on:
  #     - db
  #   ports:
  #     - 127.0.0.1:${LOCAL_API_PORT:-8002}:8000

volumes:
  db_data:
