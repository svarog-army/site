services:
  db:
    image: postgres:14
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-passwd}
      POSTGRES_DB: db
      PGDATABASE: db
      PGPASSWORD: ${POSTGRES_PASSWORD:-passwd}
      PGUSER: ${POSTGRES_USER:-postgres}
      PARKING: False

  backup:
    image: simple2b/pg-backup:1.0
    restart: always
    links:
      - db
    volumes:
      - ./backup:/backup
    environment:
      SCHEDULE_HOUR: ${SCHEDULE_HOUR:-1}
      SCHEDULE_MINUTE: ${SCHEDULE_MINUTE:-0}
      POSTGRES_DATABASE: db
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-passwd}
      POSTGRES_EXTRA_OPTS: "--schema=public --blobs"
      DAYS_HISTORY: 7
      S3_REGION: ${S3_REGION:-**None**}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-**None**}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-**None**}
      S3_BUCKET: ${S3_BUCKET:-**None**}
      S3_PREFIX: ${S3_PREFIX:-**None**}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-**None**}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-**None**}
      AWS_DEFAULT_REGION: ${S3_REGION:-**None**}
      ROBOTS_DISALLOW: ${ROBOTS_DISALLOW:"/"}

  app:
    image: simple2b/svarog-app:latest
    restart: always
    command: sh ./start_web.sh
    environment:
      APP_ENV: production
      ALCHEMICAL_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-passwd}@db:5432/db
    depends_on:
      - db
      - signal
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.svarog_py.rule=Host(`stage.svarog.army`)'
      - 'traefik.http.routers.svarog_py.tls=true'
      - 'traefik.http.routers.svarog_py.tls.certresolver=myresolver'

  signal:
    image: bbernhard/signal-cli-rest-api:latest
    restart: always
    environment:
      - MODE=json-rpc
    volumes:
      - "./signal-cli-config:/home/.local/share/signal-cli"

  # api:
  #   image: simple2b/flask-app:0.1
  #   restart: always
  #   command: sh ./start_api.sh
  #   environment:
  #     APP_ENV: production
  #     IS_API: "true"
  #     ALCHEMICAL_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-passwd}@db:5432/db
  #   depends_on:
  #     - db
  #   ports:
  #     - 127.0.0.1:${LOCAL_API_PORT:-8002}:8000

volumes:
  db_data:
