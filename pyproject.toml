[project]
name = "svarog"
version = "1.1.26"
description = ""
authors = [{ name = "kostia", email = "saintkos117@gmail.com" }]
requires-python = "~=3.12"
dependencies = [
    "flask>=2.2.3,<3",
    "flask-migrate>=4.0.4,<5",
    "flask-wtf>=1.1.1,<2",
    "flask-mail>=0.9.1,<0.10",
    "flask-login>=0.6.2,<0.7",
    "python-dotenv>=1.0.0,<2",
    "click>=8.1.3,<9",
    "psycopg2-binary>=2.9.10,<3",
    "pydantic>=2.4.2,<3",
    "alchemical>=0.7.1,<0.8",
    "fastapi>=0.103.1,<0.104",
    "uvicorn>=0.23.2,<0.24",
    "python-jose>=3.3.0,<4",
    "python-multipart>=0.0.6,<0.0.7",
    "pydantic-settings>=2.0.3,<3",
    "email-validator>=2.2.0,<3",
    "wtforms-sqlalchemy>=0.4.1,<0.5",
    "flask-babel>=4.0.0,<5",
    "signalbot>=0.10.1,<0.11",
]

[dependency-groups]
dev = [
    "pytest>=7.1.1,<8",
    "faker>=18.3.1,<19",
    "httpx>=0.25.0,<0.26",
    "mypy>=1.5.1,<2",
    "types-flask-migrate>=4.0.0.6,<5",
    "types-python-jose>=3.3.4.8,<4",
    "pybabel>=0.0.0.dev0,<0.0.1",
    "ruff>=0.6.8,<0.7",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
filterwarnings = ['ignore:.*datetime\.datetime\.utcnow.*:DeprecationWarning']
testpaths = ["test_flask", "test_api"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
files = [
    "api/**/*.py",
    "svarog/**/*.py",
    "test_api/**/*.py",
    "test_flask/**/*.py",
]

[tool.ruff]
exclude = [
    "__pypackages__",
    "__pycache__",
    ".eggs",
    ".git",
    ".github",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "node_modules",
    "migrations",
]
line-length = 120
indent-width = 4
