<div class="container mx-auto px-0 md:px-5 lg:px-10 xl:px-16">
 <div class="flex flex-col md:flex-row justify-center bg-black w-full">
    <div class="w-[100%]">
      <div class="mb-[30px] md:h-[80px] flex flex-col md:flex-row md:justify-between">
        <div class="flex flex-col md:flex-row md:me-auto">
          <div class="max-w-[140px] mx-auto md:mx-0">
            <img class="w-[90px] h-[90px] object-cover mx-auto" src="{{ url_for('static',filename='img/svarog-logo.svg') }}"
              alt="Svarog logo" />
          </div>
          <div class="flex flex-col">
            <h1
              class="text-[--main-grey] text-center md:text-start font-bold text-2xl">
              {{_("424th Battalion of USF")}}
            </h1>
            <span
              class="text-[--main-grey] mb-5 mx-auto md:mx-0 uppercase text-5xl font-ethnocentric">
              {{_("SVAROG")}}
            </span>
          </div>
        </div>
        <div class="flex flex-row justify-between mx-auto md:mx-0 w-[320px] md:w-auto">
          <div class="flex gap-3">

          <a href="https://t.me/svarog_usf" target="_blank" class="my-auto">
            <img
              src="{{ url_for('static',filename='img/telegram.svg') }}"
              width="24"
              height="24"
              alt="Telegram"
              class="hover:scale-110 active:opacity-50 active:scale-100 transition text-[--main-grey]" />
          </a>

          <a
            href="https://www.instagram.com/svarog.usf/"
            target="_blank"
            class="my-auto">
            <img
              src="{{ url_for('static',filename='img/instagram.svg') }}"
              width="24"
              height="24"
              alt="Instagram"
              class="hover:scale-110 active:opacity-50 active:scale-100 transition text-[--main-grey]" />
          </a>

          <a
            href="https://www.facebook.com/svarog.usf"
            target="_blank"
            class="my-auto">
            <img
              src="{{ url_for('static',filename='img/facebook.svg') }}"
              width="24"
              height="24"
              alt="Facebook"
              class="hover:scale-110 active:opacity-50 active:scale-100 transition text-[--main-grey]" />
          </a>
          </div>
          <form class="flex ms-14" action="{{url_for('main.change_locale')}}" method="post">
          {{ form.hidden_tag() }}
          <div class="my-auto">
            <label for="local_select" class="sr-only">Language select</label>
            <select id="local_select" name="locale" onchange="this.form.submit()"
              class="block py-2.5 px-0 w-full text-sm text-[--main-grey] bg-transparent border-none appearance-none focus:outline-none focus:ring-0 peer cursor-pointer">
              <option class="dark:bg-gray-700 text-black dark:text-white text-center" value="uk" {% if g.lang_code=='uk' %}
                selected {% endif %}>УКР</option>
              <option class="dark:bg-gray-700 text-black dark:text-white text-center" value="en" {% if g.lang_code=='en' %}
                selected {% endif %}>EN</option>
            </select>
          </div>
          </form>
        </div>
      </div>
      <div class="mb-[30px] md:text-end pe-7">
        <pre class="text-slate-700">{{config.VERSION}}</pre>
      </div>
    </div>
 </div>
</div>
