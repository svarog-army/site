<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ config.APP_NAME }}</title>
    <!-- meta -->
    <meta name="description" content="Svarog site" />
    <meta name="author" content="Simple2B" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script src="{{ url_for('static', filename='js/lib/htmx.min.js') }}" type="text/javascript" defer></script>
    <script src="{{ url_for('static', filename='js/lib/response-targets.js') }}" type="text/javascript" defer></script>
    <link rel="icon" href="{{ url_for('static', filename='img/logo.svg') }}" />

    {% block meta %}{% endblock %}

    <!-- styles -->
    <!-- prettier-ignore -->
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet" />
    <!-- prettier-ignore -->
    {% block links %}
    {% endblock %}
  </head>

  <body  class="bg-white dark:bg-gray-800">
    {% block body %}
    <div class="h-screen w-screen bg-cover bg-center bg-no-repeat bg-[url('../../static/img/bg.png')]">
      <!-- Main Content -->

      {% block content %}
        <div class="flex flex-col items-center">
            <!-- component -->
            <p class="text-white uppercase font-extrabold 2xl:text-7xl sm:text-xs mt-20 text-center text-base lg:text-3xl">
                424 окремий батальйон безпілотних систем
            </p>

            <img
                src="{{url_for('static',filename='img/chevron.png')}}"
                class="2xl:w-[800px]  lg:w-[400px] 2xl:mt-32 2xl:mb-30 lg:mt-20 lg:mb-20"
                alt="chevron" />
            <p class="text-white uppercase font-extrabold 2xl:text-7xl sm:text-xs mt-20 text-center text-base lg:text-3xl">
                сайт знаходиться на стадії розробки
            </p>
        </div>
      {% endblock %}
    </div>
    {% endblock %}
    <!-- scripts -->

    <!-- prettier-ignore -->

  </div>
  <script src="{{ url_for('static', filename='js/base.js') }}" type="text/javascript" defer></script>

  <div id="not-found"></div>
  {% include 'spinner.html' %}

  {% block scripts %} {% endblock %}

</body>
</html>
