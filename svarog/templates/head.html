<div class="flex justify-center">
  <div class="container absolute flex justify-between items-center w-full px-5 lg:px-16 mt-5 md:mt-12  text-black">
    <a href="/" class="flex items-start h-[24px]">
      <img class="h-full object-cover"
        src="{{ url_for('static',filename='img/svarog-logo.svg') }}"
        alt="Svarog logo" />
      <span class="text-xl font-bold font_uaf_bold ml-2 text-[--main-grey-87]">
        424
      </span>
      <span class="text-xl font-bold font_uaf_bold ml-2 text-[--main-grey] hidden sm:inline uppercase">
        Svarog
      </span>
    </a>

    <div class="hidden lg:inline-flex">
      <a href="/" class="text-[--main-white-87] text-base px-[10px] py-3 hover:bg-[--main-grey-opacity]">
        {{_("Main")}}
      </a>
      <a href="{{g.custom_links.test_drive_url}}" target="_blank" class="text-[--main-white-87] text-base px-[10px] py-3 hover:bg-[--main-grey-opacity]">
        {{_("Test course")}}
      </a>
      <a href="/donate" class="text-[--main-white-87] text-base px-[10px] py-3 hover:bg-[--main-grey-opacity]">
        {{_("To support")}}
      </a>
      <a href="/#vacancies" class="text-[--main-white-87] text-base px-[10px] py-3 hover:bg-[--main-grey-opacity]">
        {{_("Vacancies")}}
      </a>
    </div>

    <div class="flex items-center gap-4 h-[24px]">
      <div class="flex gap-3">

        <a href={{g.custom_links.telegram_url}} target="_blank" class="my-auto">
          <img src="{{ url_for('static',filename='img/telegram.svg') }}" width="24" height="24" alt="Telegram" class="hover:scale-110 active:opacity-50 active:scale-100 transition text-[--main-grey]"/>
        </a>

        <a href={{g.custom_links.instagram_url}} target="_blank" class="my-auto">
          <img src="{{ url_for('static',filename='img/instagram.svg') }}" width="24" height="24" alt="Instagram" class="hover:scale-110 active:opacity-50 active:scale-100 transition text-[--main-grey]"/>
        </a>

        <a href={{g.custom_links.facebook_url}} target="_blank" class="my-auto">
            <img src="{{ url_for('static',filename='img/facebook.svg') }}" width="24" height="24" alt="Facebook" class="hover:scale-110 active:opacity-50 active:scale-100 transition text-[--main-grey]" />
        </a>

      </div>

      <button id="open-sidebar-menu" class="py-1">
        <img src="{{ url_for('static',filename='img/burger.svg') }}" width="26" height="26" alt='{{_("Open menu")}}' class="hover:scale-110 active:opacity-50 active:scale-100 transition text-[--main-grey] lg:hidden"/>
      </button>
      <div id="sidebar-menu" class="fixed z-50 inset-y-0 right-0 w-full bg-[--main-grey] transform translate-x-full transition-transform duration-300 ease-in-out">
        <button id="close-sidebar-menu" class="absolute top-8 right-8 py-1 text-[--main-black]">
          <img src="{{ url_for('static',filename='img/cross.svg') }}" width="32" height="32" alt='{{_("Close menu")}}' class=" hover:scale-110 active:opacity-50 active:scale-100 transition text-[--main-grey]"/>
        </button>
        
        <div class="flex flex-col mt-40 space-y-4 text-end pe-8">
          <a href="/" class="text-[--menu-black] text-3xl font-semibold hover:underline active:no-underline">
            {{_("Main")}}
          </a>
          <a href="{{g.custom_links.test_drive_url}}" target="_blank" class="text-[--menu-black] text-3xl font-semibold hover:underline active:no-underline">
            {{_("Test course")}}
          </a>
          <a href="/donate" class="text-[--menu-black] text-3xl font-semibold hover:underline active:no-underline">
            {{_("To support")}}
          </a>
          <a href="/#vacancies" class="text-[--menu-black] text-3xl font-semibold hover:underline active:no-underline">
            {{_("Vacancies")}}
          </a>
        </div>

        <div class="flex flex-col mt-20 space-y-4 text-end pe-8">
          <span class="text-2xl">{{_("Change language:")}}</span>
          <form class="gap-8" action="{{url_for('main.change_locale')}}" method="post">
            {{ form.hidden_tag() }}
            <div>
              <label for="local_select_mobile" class="sr-only">Language select</label>
              <select id="local_select_mobile" name="locale" onchange="this.form.submit()"
                class="local_select_mobile block ms-auto py-2.5 px-0 pe-0 text-3xl text-[--menu-black] bg-transparent border-none appearance-none focus:outline-none focus:ring-0 peer cursor-pointer">
                <!-- prettier-ignore -->
                <option class="text-[--menu-black] text-3xl font-semibold hover:underline active:no-underline" value="uk" {% if g.lang_code=='uk' %}
                  selected {% endif %}>Українська</option>
                <option class="text-[--menu-black] text-3xl font-semibold hover:underline active:no-underline" value="en" {% if g.lang_code=='en' %}
                  selected {% endif %}>English</option>
              </select>
            </div>
      </form>
        </div>
      </div>

      <form class="hidden lg:flex gap-8" action="{{url_for('main.change_locale')}}" method="post">
        {{ form.hidden_tag() }}
        <div>
          <label for="local_select" class="sr-only">Language select</label>
          <select id="local_select" name="locale" onchange="this.form.submit()"
            class="block py-2.5 px-0 w-full text-sm text-[--main-grey] bg-transparent border-none appearance-none focus:outline-none focus:ring-0 peer cursor-pointer">
            <!-- prettier-ignore -->
            <option class="dark:bg-gray-700 text-black dark:text-white text-center" value="uk" {% if g.lang_code=='uk' %}
              selected {% endif %}>УКР</option>
            <option class="dark:bg-gray-700 text-black dark:text-white text-center" value="en" {% if g.lang_code=='en' %}
              selected {% endif %}>EN</option>
          </select>
        </div>
      </form>
    </div>

  </div>
</div>
