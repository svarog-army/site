{% extends "base.html" %} {% block content %}
<div class="flex flex-col items-center align-baseline h-screen">
  <form
    class="absolute top-6 right-6 lg:top-12 lg:right-12 max-w-sm mx-auto flex flex-row lg:flex-col"
    action="{{url_for('main.change_locale')}}"
    method="post">
    {{ form.hidden_tag() }}
    <label for="local_select" class="sr-only">Language select</label>
    <select
      id="local_select"
      name="locale"
      onchange="this.form.submit()"
      class="block py-2.5 px-0 w-full text-sm text-black dark:text-white bg-transparent border-0 border-b-2 border-gray-200 appearance-none dark:border-gray-700 focus:outline-none focus:ring-0 focus:border-gray-200 peer">
      <option value="uk" {% if g.lang_code == 'uk' %} selected {% endif %}>UA</option>
      <option value="en" {% if g.lang_code == 'en' %} selected {% endif %}>EN</option>
    </select>
    <button
      id="theme-toggle"
      type="button"
      class="text-gray-500 dark:text-gray-400 hover:bg-gray-100 mr-2 dark:hover:bg-gray-700 focus:outline-none focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-700 rounded-lg text-sm p-2.5">
      <svg
        id="theme-toggle-dark-icon"
        class="hidden w-5 h-5"
        fill="currentColor"
        viewBox="0 0 20 20"
        xmlns="http://www.w3.org/2000/svg">
        <path
          d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
      </svg>
      <svg
        id="theme-toggle-light-icon"
        class="hidden w-5 h-5"
        fill="currentColor"
        viewBox="0 0 20 20"
        xmlns="http://www.w3.org/2000/svg">
        <path
          d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"
          fill-rule="evenodd"
          clip-rule="evenodd"></path>
      </svg>
    </button>
  </form>

  <div class="flex flex-col flex-1 items-center container justify-evenly">
    <!-- component -->
    <p
      class="text-white uppercase font-extrabold 2xl:text-7xl text-lg text-center md:text-2xl lg:text-3xl">
      {{_("424th separate battalion of unmanned systems")}}
    </p>

    <img
      src="{{url_for('static',filename='img/chevron.png')}}"
      class="w-full md:w-3/4 xl:w-1/2 "
      alt="chevron" />
    <p
      class="text-white uppercase font-extrabold 2xl:text-7xl text-lg text-center md:text-2xl lg:text-3xl">
      {{_("site is under construction")}}
    </p>
  </div>
</div>
{% endblock %} {% block scripts %} {% endblock %}
