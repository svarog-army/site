name: Build and Deploy

on:
  push:
    tags:
      - 'v*.*.*'

env:
  DOCKER_LOGIN: simple2b
  IMAGE_NAME: simple2b/svarog-app
  DEPLOY_HOST: ${{ secrets.SSH_HOST_IP_STAGING }}
  DEPLOY_USER_NAME: ${{ secrets.SSH_USER }}
  DEPLOY_SSH_KEY: ${{ secrets.SSH_KEY }}
  DEPLOY_SSH_PORT: ${{ secrets.SSH_PORT }}
  DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  SIGNAL_BOT_CONFIG_BASE64: ${{ secrets.SIGNAL_BOT_CONFIG_BASE64 }}


jobs:
  on-develop-branch-check:
    runs-on: Linux
    outputs:
      on_develop: ${{ steps.contains_tag.outputs.retval }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: rickstaa/action-contains-tag@v1
        id: contains_tag
        with:
          reference: 'develop'
          tag: '${{ github.ref }}'

  test:
    name: Test
    runs-on: Linux
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install pipx
        run: pip install --user pipx
      - name: Add pipx to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Setup poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: 1.6.1
      - name: Install dependencies
        working-directory: .
        run: |
          poetry install
      - name: Lint with ruff
        working-directory: .
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
      - name: Run mypy
        working-directory: .
        run: |
          poetry run mypy
      - name: Run pytest
        working-directory: .
        run: |
          poetry run pytest test_flask
          poetry run pytest test_api

  build:
    name: Build and Push
    runs-on: Linux
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # list of Docker images to use as base name for tags
          images: |
            ${{ env.IMAGE_NAME }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_LOGIN }}
          password: ${{ env.DOCKER_ACCESS_TOKEN }}
      - name: Build and Push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  deploy:
    name: Deploy to staging
    runs-on: Linux
    needs:
      - on-develop-branch-check
      - build
    if: ${{ needs.on-develop-branch-check.outputs.on_develop == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Get signal config
        run: |
          echo "${{ env.SIGNAL_BOT_CONFIG_BASE64 }}" | base64 -d > signal-cli-config.tar.gz
      - name: Copy signal config archive
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER_NAME }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          source: signal-cli-config.tar.gz
          target: ~/svarog_py
      - name: update compose file
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER_NAME }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          source: compose.staging.yaml
          target: ~/svarog_py
      - name: deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER_NAME }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          envs: SIGNAL_BOT_CONFIG_BASE64
          script: |
            cd ~/svarog_py &&
            mv compose.staging.yaml compose.yaml &&
            docker compose pull &&
            docker compose stop signal &&
            tar -xzf signal-cli-config.tar.gz &&
            docker compose up -d &&
            docker system prune -f
